[project]
name = "checkpoint-rag"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "langchain>=1.4.6",
    "langchain-text-splitters>=1.1.3",
    "markdown>=3.11.1",
    "ollama>=0.6.3",
    "openai>=3.35.1",
    "pypdf>=6.21.1",
    "python-dotenv>=1.2.4",
    "tqdm>=4.70.1",
    "unstructured[pdf]>=0.27.28",
    "weaviate-client>=4.23.1",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""
